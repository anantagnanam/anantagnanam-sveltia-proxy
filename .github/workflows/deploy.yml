# Allow deploying the project to Cloudflare Workers
# https://developers.cloudflare.com/workers/tutorials/deploy-button/

name: Build
on:
  repository_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 12.9.1
          runtime: node@26
          cache: true
      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          packageManager: pnpm
          wranglerVersion: 4.145.0
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
